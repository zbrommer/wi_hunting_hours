# Builds the iOS app (Capacitor shell around dist/) on a GitHub Mac and uploads it to
# App Store Connect / TestFlight. Run it by hand: Actions → "iOS build" → Run workflow.
# Needs repo secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY (the .p8 file's text).
# The Xcode project in app/ios is generated fresh each run, then customized by app/ios_patch.py.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version shown in the App Store
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Xcode project
        run: |
          npm install --no-audit --no-fund
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          python3 ios_patch.py
          ruby add_sound.rb
      - name: App Store Connect key
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/keys/AuthKey.p8"
      # Archive unsigned, then sign for the App Store during export: Xcode creates the
      # distribution certificate and profile in the cloud with the API key (no Mac or device needed).
      - name: Archive
        run: |
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            TARGETED_DEVICE_FAMILY=1 DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Sign and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
