# Publishes dist/ (the built, self-contained page) to GitHub Pages on every push to main.
# Upload and deploy are separate jobs: with both in one job, deploy-pages sometimes
# looked for the artifact before GitHub had registered it ("No artifacts named github-pages").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Same as actions/upload-pages-artifact, but keeps dot-folders: that action always
      # drops them, and Android needs dist/.well-known/assetlinks.json.
      - name: Archive dist
        run: tar --dereference --hard-dereference --directory dist -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
